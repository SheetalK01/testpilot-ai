name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  # Every automated test uses the deterministic mock AI: free, fast and repeatable.
  # Runners are pinned to Ubuntu 24.04 so font rendering matches the committed Linux visual baselines.
  AI_MODE: mock

jobs:
  lint:
    name: Lint (ESLint, Prettier, Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai_engine/requirements-dev.txt
      - name: Frontend lint and format
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run format:check
      - name: E2E lint and format
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run format:check
      - name: AI engine lint and format (Ruff)
        working-directory: ai_engine
        run: |
          pip install "ruff==0.17.2"
          ruff check .
          ruff format --check .

  backend:
    name: Backend (JUnit + JaCoCo)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build, test and enforce coverage
        working-directory: testpilot_backend
        run: ./mvnw -B verify
      - name: Coverage summary
        if: always()
        working-directory: testpilot_backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } NR>1 && $3 ~ /Service$/ { smissed+=$8; scovered+=$9 }
              END { printf "### Backend coverage\n\n| Scope | Line coverage |\n|---|---|\n| All classes | %.1f%% |\n| Services (gate: 80%%) | %.1f%% |\n",
                    100*covered/(missed+covered), 100*scovered/(smissed+scovered) }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            testpilot_backend/target/site/jacoco
            testpilot_backend/target/surefire-reports
          retention-days: 14

  ai-engine:
    name: AI engine (pytest)
    needs: lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai_engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Evaluation pipeline runs (mock mode)
        run: python -m eval.run_eval
        env:
          MOCK_DELAY_SECONDS: '0'

  frontend:
    name: Frontend (build)
    needs: lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: E2E (Playwright UI, API, a11y, visual)
    needs: [backend, ai-engine, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai_engine/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build backend jar
        working-directory: testpilot_backend
        run: ./mvnw -B -q package -DskipTests
      - name: Install AI engine
        working-directory: ai_engine
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run all Playwright projects (webServer starts the stack)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: e2e/test-results
          retention-days: 7

  perf:
    name: Docker stack (API suite on MySQL + k6 smoke)
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack (MySQL, AI engine, backend, Nginx frontend)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke-check the Nginx frontend and API proxy
        run: |
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsSI http://localhost:3000/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me)" = "401"
      - name: API and security suites against MySQL behind Nginx
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8080
          # docker-compose.yml's default JWT secret (no .env in CI)
          JWT_SECRET: compose-dev-secret-change-me-0123456789
        run: |
          npm ci --no-audit --no-fund
          npx playwright test --project=api
      - uses: grafana/setup-k6-action@v1
      - name: k6 smoke (10 VUs x 30 s, p95 < 500 ms, errors < 1%)
        run: k6 run perf/smoke.js
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
