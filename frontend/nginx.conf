# Correlation ID: keep the client's X-Request-Id, otherwise use Nginx's own request id.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port, so same-origin calls are not mistaken for CORS requests.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $correlation_id;
        # AI generation may take up to AI_ENGINE_TIMEOUT_SECONDS (120 s) on the backend.
        proxy_read_timeout 150s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Health check used by the frontend's "waking up the server" loader.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fingerprinted build assets never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: unknown paths are client-side routes. index.html must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
