# Full stack: http://localhost:3000 (app), http://localhost:8080/swagger-ui.html (API docs).
# Copy .env.example to .env first; every value has a safe default for local use.
name: testpilot

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testpilot}
      MYSQL_USER: ${MYSQL_USER:-testpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpilot-change-me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ai-engine:
    build: ./ai_engine
    environment:
      AI_MODE: ${AI_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
    restart: unless-stopped

  backend:
    build: ./testpilot_backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-testpilot}
      DB_USERNAME: ${MYSQL_USER:-testpilot}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testpilot-change-me}
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me-0123456789}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_TIMEOUT_SECONDS: ${AI_ENGINE_TIMEOUT_SECONDS:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
