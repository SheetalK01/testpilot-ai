[project]
name = "testpilot-ai-engine"
version = "1.0.0"
description = "TestPilot AI engine: user stories to test cases with Claude"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest checks things

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Only functions are tests; avoids collecting app classes such as TestCaseType.
python_classes = []
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app", "eval"]
omit = ["eval/__init__.py"]
