server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: testpilot-backend
  datasource:
    # H2 in MySQL mode when DB_URL is unset (local dev + tests); MySQL 8 in docker-compose.
    url: ${DB_URL:jdbc:h2:mem:testpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

testpilot:
  jwt:
    # Dev-only default. Production must override JWT_SECRET (>= 32 bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  ai-engine:
    url: ${AI_ENGINE_URL:http://localhost:8000}
    timeout-seconds: ${AI_ENGINE_TIMEOUT_SECONDS:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Public on purpose: the API docs are part of the portfolio.
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.orm.deprecation: error
